---
# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Diffpi plan workflow evaluations
prompts:
  - 'Run {{case}}'
providers:
  - file://providers/pi-provider.ts
defaultTest:
  options:
    # Transport only; Promptfoo applies each rubric and decides pass/fail.
    provider: file://providers/pi-judge.ts
evaluateOptions:
  # Two 30-minute candidate stages plus model-graded rubrics; a shorter
  # outer timeout discards completed New/Update artifacts before grading.
  timeoutMs: 4200000
tests:
  - file://cases/*.yaml
