# =============================================================================
# mise.toml - bun (TypeScript) template
# Overlays the base mise.toml during scaffold. Tasks are file tasks under
# mise-tasks/ (this template overrides only the tasks that differ from base).
# =============================================================================

# Enable mise monorepo mode: root task addressing + per-package mise.toml files.
monorepo_root = true

[monorepo]
# Each package directory may carry its own mise.toml (tools, env, tasks);
# tasks are addressed as //packages/<name>:<task> from the repo root.
config_roots = ["packages/*"]

[env]
_.path   = ['{{config_root}}/node_modules/.bin']
PROJECT  = "pizen"
TEMPLATE         = "mise-bun-template"
VERSION  = "{{exec(command='cat version.txt 2>/dev/null || echo 0.1.0')}}"

[tools]
# bun provides its own Node-compatible runtime; no separate node/pnpm tool needed.
bun        = "1"
bats       = "latest"
shellcheck = "latest"
shfmt      = "latest"

[task_config]
includes = ["mise-tasks"]

[settings]
experimental = true
