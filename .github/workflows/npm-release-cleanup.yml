name: npm release cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Unpublish incorrect release
        run: npm unpublish @difflab/pi@1.0.0 --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
