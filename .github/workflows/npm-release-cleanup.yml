name: npm release cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Deprecate incorrect release
        run: npm deprecate @difflab/pi@1.0.0 "Published in error; use 0.1.0"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
